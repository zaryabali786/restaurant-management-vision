name: Check the camera worker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The worker is NOT deployed to the VPS: it runs on a PC inside each restaurant,
# beside the cameras (their RTSP addresses are local), and reports to
# https://api.whatsmeal.com/api with that restaurant's worker key.
# This only proves every file still compiles and the stream helpers still pass.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Every file compiles
        run: python -m compileall -q .
